fiscal_year: "2026-27"
# Source: Bangladesh Bank holiday circular for FY2026-27.
# TODO: load the full official FY2026-27 gazette list when published; entries
# below are only what is confirmed so far.
holidays:
  # Bank half-yearly closing — data-confirmed (market-wide silence on a weekday).
  - date: "2026-07-01"
    name: "Bank holiday - half-yearly closing (data-confirmed)"
    type: INFERRED_CLOSURE
  # Data-confirmed closure: on 2026-08-05 the money market was shut — call money,
  # reference rates and OMO all had ZERO activity, while 04-Aug and 06-Aug were
  # both fully active (6 call-money / 6 ref-rate rows, live OMO). An isolated
  # all-source zero flanked by active days is a bank-holiday signature, and it
  # explains the 2-day publication lag of the 04-Aug (Tue) CB Repo. Gazette name
  # to be confirmed and updated here.
  - date: "2026-08-05"
    name: "Bank/money-market closed (inferred; confirm gazette name)"
    type: INFERRED_CLOSURE
  # Same signature on 2026-08-26 (Wed): call money, ref rates and OMO all ZERO
  # while 25-Aug and 27-Aug were fully active — a market-wide closure.
  - date: "2026-08-26"
    name: "Bank/money-market closed (inferred; confirm gazette name)"
    type: INFERRED_CLOSURE
  # Declared working Saturday, data-confirmed: on 2026-10-17 call money (3 rows),
  # reference rates (6), interbank repo (1) and interbank FX (3, carrying BB's OWN
  # trade_date of 2026-10-17) all printed, and the exchange-rate page published on
  # the 18th describes that day. Without this entry previous_working_day() walked
  # the 18th's FX row back over Sat 17 and Fri 16 and dated it 15-Oct, on top of
  # the real 15-Oct figures. It lives HERE and not only in the database because a
  # fiscal-year sweep once deleted a database-only copy within hours.
  - date: "2026-10-17"
    name: "Declared working day (Saturday; data-confirmed)"
    type: WORKING_DAY
