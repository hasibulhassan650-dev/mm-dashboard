# Holes in the record that no fetch can fill, established from evidence. Loaded by
# engines/absences.py::sync_known_absences on every refresh. Rules, same as every other absence:
#   * a reason with the evidence is required;
#   * a day we HOLD data for is refused (it is not absent);
#   * kind bb_omission = BB did not publish it; kind lost = ours, and BB cannot give it back.
# They stay visible in the digest forever - a skipped day is a known hole, not an invisible one.
absences:
  # OMO on Saturday 17-Oct-2026. The banks WERE open that day (SDAD circular letter 15 of 11-Oct reopens
  # Saturday 17-Oct on the normal schedule; call money, reference rates and the interbank repo printed),
  # and BB did operate: the 18-Oct release prints maturities of 3,471.54 (Assured Repo) and 1,634.34 (SDF)
  # that only a 17-Oct deal can explain. But BB never posted the release: its press list carries "as on
  # 15 October" (serial 05/2026-470) and then "as on 18 October" (05/2026-472), and serial 471 is absent
  # from every list read between 18-Oct and 28-Oct. The size of the 17-Oct deals is not guessed from the
  # maturities - it stays unknown, and the ledger rule below says why.
  - dataset: omo
    date: 2026-10-17
    kind: bb_omission
    source: https://www.bb.org.bd/en/index.php/mediaroom/press_release
    reason: >-
      BB posted no OMO release for Saturday 17-Oct-2026 although the banks were open and it operated
      (18-Oct maturities imply deals); serial 05/2026-471 is missing from BB's press list.
  # Exchange rates for Sunday 25-Oct-2026. The page describes the previous business day and only ever
  # shows its latest snapshot; the run that should have read it was blocked by BB's firewall (a CAPTCHA to
  # GitHub's servers from 22-Oct), and by the time the page was read from a PC it had moved on.
  - dataset: fxrates
    date: 2026-10-25
    kind: lost
    source: https://www.bb.org.bd/en/index.php/econdata/exchangerate
    reason: >-
      Not read while BB's firewall blocked the scheduled runners; BB's page keeps only the latest day, so
      it cannot be re-read.
  # Exchange rates for Thursday 29-Oct-2026. The page describes the previous business day and only ever
  # shows its latest snapshot. Our reads: the 28-Oct snapshot was ingested on 31-Oct 17:43 UTC and the
  # 1-Nov snapshot on 2-Nov 14:01 UTC; the page was describing 29-Oct only in between (it is published on
  # the next business day, Sunday 1-Nov), when no read landed (BB blocks the scheduled runners and the PC
  # tasks were installed late on 31-Oct).
  - dataset: fxrates
    date: 2026-10-29
    kind: lost
    source: https://www.bb.org.bd/en/index.php/econdata/exchangerate
    reason: >-
      Not read while the page described 29-Oct (held: 28-Oct read on 31-Oct, 1-Nov read on 2-Nov); BB's
      page keeps only the latest day, so it cannot be re-read.

  # Exchange rates for Thursday 5-Nov-2026. The page only ever shows its latest snapshot and describes the
  # previous business day. Our reads: the 4-Nov snapshot was ingested on 7-Nov 14:50 UTC and the 8-Nov
  # snapshot on 9-Nov 12:46 UTC; the page described 5-Nov only in between (published the next business day,
  # Sunday 8-Nov), when no read landed.
  - dataset: fxrates
    date: 2026-11-05
    kind: lost
    source: https://www.bb.org.bd/en/index.php/econdata/exchangerate
    reason: >-
      Not read while the page described 5-Nov (held: 4-Nov read on 7-Nov, 8-Nov read on 9-Nov); BB's page
      keeps only the latest day, so it cannot be re-read.
  # Exchange rates for Tuesday 10-Nov-2026. Our reads: the 9-Nov snapshot was ingested on 10-Nov 13:31 UTC and
  # the 11-Nov snapshot on 12-Nov 15:05 UTC; the page described 10-Nov only in between (published the next
  # business day, Wednesday 11-Nov), when no read landed.
  - dataset: fxrates
    date: 2026-11-10
    kind: lost
    source: https://www.bb.org.bd/en/index.php/econdata/exchangerate
    reason: >-
      Not read while the page described 10-Nov (held: 9-Nov read on 10-Nov, 11-Nov read on 12-Nov); BB's
      page keeps only the latest day, so it cannot be re-read.

# A maturity BB's own releases contradict. Not an absent day: the day IS held, and one row of it is
# short. validate.py's omo-ledger check compares the tranches we hold maturing on a day with BB's printed
# maturity; when BB's print omits a tranche that BB's own earlier release shows, the check would fail
# forever. An entry here turns that ONE finding into a dated notice, and only while the gap equals the
# omitted amount (within tolerance) - any other gap on that day, or a correction by BB, is judged normally.
# (Empty on purpose. The one entry it held, "BB's 29-Oct release omits the 1-day AR tranche", was WRONG: pr14382
# (as on 11-Nov) later printed that tranche maturing as a 14-day one, so BB omitted nothing - it had mislabelled
# the tenor, and the fix is the tenor_corrections entry below. A print error is only recorded when no later
# BB print explains the gap.)
print_errors: []

# A tranche whose PRINTED tenor BB's own later maturity print contradicts. Not an absent day and not a missing
# maturity: the deal is stored once, with the maturity date BB's figures prove. Applied to stored rows and to every
# re-read of the PDF (engines/absences.py), so the printed tenor cannot come back. The printed tenor_label stays.
tenor_corrections:
  # pr14340 (as on 25-Oct, a Sunday) prints "CB Repo 7-Days 15,861.75". pr14346 (as on 27-Oct) prints a CB Repo
  # maturity of 15,870.00 = 15,861.75 + 2 days' profit at 9.50% (15,870.01), and pr14362 (as on 1-Nov), the
  # date a 7-day tranche would mature, prints only the 1-day Thursday tranche (4,695.51). So it matured 27-Oct.
  # Left uncorrected it was counted as 15.9k cr of CB Repo outstanding from 27-Oct to 1-Nov (the omo-ledger's
  # 1-Nov phantom), and the shortfall on 27-Oct was being excused by the 17-Oct absence window.
  - dataset: omo
    instrument: CB_REPO
    deal_date: 2026-10-25
    accepted_crore: 15861.75
    true_maturity: 2026-10-27
    source: https://www.bb.org.bd/mediaroom/press_release/press/pr14340_20261026.pdf
    reason: >-
      BB's 27-Oct release prints this tranche maturing 15,870.00 (principal plus 2 days' profit at 9.50%), so it
      was a 2-day operation although the 25-Oct release prints "7-Days".
  # pr14357 (as on 28-Oct) prints "AR 1-Day 309.88". BB's 29-Oct release (pr14359) prints no AR maturity for it (its only
  # AR maturity that day is the 15-Oct 14-day tranche, 1,202.99), and pr14382 (as on 11-Nov) prints "AR 14-Days
  # -311.01" = 309.88 + 14 days' profit at 9.50% (311.009). So it was a 14-day operation maturing 11-Nov (a Wednesday,
  # a working day, so no holiday roll). Found by the 11-Nov omo-ledger shortfall (130 cr held vs 441 cr printed).
  - dataset: omo
    instrument: AR
    deal_date: 2026-10-28
    accepted_crore: 309.88
    true_maturity: 2026-11-11
    source: https://www.bb.org.bd/mediaroom/press_release/press/pr14382_20261112.pdf
    reason: >-
      BB's 11-Nov release prints an AR maturity of 311.01 = 309.88 + 14 days' profit at 9.50%, and its 29-Oct release
      prints no maturity for this tranche, so it was a 14-day operation although the 28-Oct release prints "1-Day".

# Per-tenor gaps between BB's printed maturity and the tranches we hold, that a person has proven or labelled. Read by
# engines/absences.py::judge_ledger_day for BOTH validate.py's omo-ledger rule and deep_audit.py. An entry excuses ONLY the
# tenor row whose gap still equals gap_crore (within tolerance_crore); any other amount on that day, or a BB correction,
# is judged normally. Every excused entry is REPORTED as a notice on every run - nothing here is invisible, and nothing is
# written to the production tables (no invented tranche). status: lost_deal = ours, proved from BB's own figures;
# unexplained = a BB maturity no deal in our record explains. gap_crore = BB printed minus our grown tranches (profit for
# the days actually elapsed, maturity rolled to a working day).
ledger_exceptions:
  # 1-Nov-2026 AR 180D. BB (pr14362) prints a 180-day AR maturity of 2,903.34; the one 180-day tranche we hold maturing
  # that day is the 3-May deal of 2,065.63 at 10.00% (182 days after the roll to Sunday 1-Nov = 2,168.63). The gap is 734.71.
  # 4-May-2026 is the day it was lost: the release stored as "as on 04 May" (pr14062) was a stale republish of 5-Apr, so the
  # real 4-May operation was never read. An AR 180D deal of exactly 700.00 at 10.00% for the 181 days 4-May -> 1-Nov
  # grows to 700.00 x (1 + 0.10 x 181/365) = 734.71, and 2,168.63 + 734.71 = 2,903.34 to the paisa. No tranche is
  # written for it: the principal is arithmetic on BB's own figure, and the 4-May release itself cannot be re-read.
  - dataset: omo
    instrument: AR
    date: 2026-11-01
    tenor_days: 180
    gap_crore: 734.71
    tolerance_crore: 0.10
    status: lost_deal
    reason: >-
      Lost 4-May-2026 AR 180D deal of 700.00 cr at 10.00%: 700.00 x (1 + 0.10 x 181/365) = 734.71, and our 3-May tranche
      2,065.63 x (1 + 0.10 x 182/365) = 2,168.63, together 2,903.34 = BB's printed 180D maturity to the paisa. The 4-May
      release (pr14062) was a stale republish of 5-Apr, so the 4-May operation was never stored. Principal is arithmetic,
      not a stored tranche.
  # 27-Oct-2026 AR "7D" 36.73 - INFERRED, not proven. BB printed a maturity-only row "AR 7D 36.73" (row 88488, pr14353) that no
  # deal in our record explains if its '7D' label is taken as true (a 7-day deal would have been struck on 20-Oct, a gazetted
  # closed day). BB's tenor labels on OMO rows are known to be unreliable (tenor_corrections above), and the print is explained
  # exactly by an older AR 180D deal: 27-Oct less 180 days is 30-Apr-2026 (a working Thursday), and a round principal of 35.00
  # at the 10.00% AR rate then in force is 35.00 x (1 + 0.10 x 180/365) = 36.726 = 36.73 to the paisa. The same 35.00 appears
  # to roll every 180 days: row 34810 (28-Apr-2026, "AR 180D", maturity-only 36.73) is its previous leg, a deal of 30-Oct-2025
  # (outside our history; 30-Oct-2025 + 180 days = 28-Apr-2026). Our stored 30-Apr rows hold no AR deal (only the 14D
  # maturity-only row 34821), so the 30-Apr deal is one we never stored. Not proven: no second BB statement confirms the
  # principal, and re-reading the 30-Apr release (pr14059) needs BB's firewall to let the PC in. Proof = that release showing
  # "AR 180D 35.00 10.00". No tranche is written. Row 34810 repeats the amount, which is corroboration, not evidence.
  - dataset: omo
    instrument: AR
    date: 2026-10-27
    tenor_days: 7
    gap_crore: 36.73
    tolerance_crore: 0.10
    status: inferred_deal
    reason: >-
      Inferred AR 180D deal of 35.00 cr at 10.00% struck 30-Apr-2026 (27-Oct less 180 days), printed by BB under the wrong
      tenor label "7D": 35.00 x (1 + 0.10 x 180/365) = 36.726 = 36.73 to the paisa. The same 35.00 matured on 28-Apr-2026
      (row 34810, "AR 180D" 36.73), a roll of the 30-Oct-2025 leg. Our 30-Apr rows hold no AR deal. Not independently
      confirmed: the 30-Apr release (pr14059) would prove it.
