fiscal_year: "2025-26"
# Source: Bangladesh Bank holiday circular + DATA VERIFICATION.
# The original "approximate - update on moon sighting" Eid dates were never
# updated and turned out WRONG (the money market traded on 30/31-Mar, 01-Apr and
# 07-Jun). Every date below is cross-checked against actual market activity:
# a listed holiday must show NO call-money, NO reference-rate and NO OMO prints.
# INFERRED_CLOSURE = confirmed from that market-wide silence on a weekday.
holidays:
