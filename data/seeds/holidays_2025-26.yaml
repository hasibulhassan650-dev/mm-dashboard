fiscal_year: "2025-26"
# Source: Bangladesh Bank holiday circular + DATA VERIFICATION.
# The original "approximate - update on moon sighting" Eid dates were never
# updated and turned out WRONG (the money market traded on 30/31-Mar, 01-Apr and
# 07-Jun). Every date below is cross-checked against actual market activity:
# a listed holiday must show NO call-money, NO reference-rate and NO OMO prints.
# INFERRED_CLOSURE = confirmed from that market-wide silence on a weekday.
# WORKING_DAY = a Fri/Sat the government declared a working day (the market
# traded: call money, reference rates, FX auction all printed). Settlements
# falling on it are paid THAT day — calendar_utils treats it as working.
holidays:
  # ── FY2025-26 H1: all data-confirmed (market-wide silence on a weekday) ──
  - date: "2025-07-01"
    name: "Bank holiday - half-yearly closing (data-confirmed)"
    type: INFERRED_CLOSURE
  - date: "2025-07-06"
    name: "Ashura (data-confirmed)"
    type: INFERRED_CLOSURE
  - date: "2025-08-05"
    name: "July Mass Uprising Day (data-confirmed)"
    type: INFERRED_CLOSURE
  - date: "2025-10-01"
    name: "Durga Puja - Maha Navami (data-confirmed)"
    type: INFERRED_CLOSURE
  - date: "2025-10-02"
