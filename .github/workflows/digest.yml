# .github/workflows/digest.yml
#
# The morning report — the one alarm that fires whether or not anything is wrong.
#
# Every other check here is exception-based: it speaks only when something
# breaks. That leaves a hole nothing else covers — when the alarm itself stops,
# silence is indistinguishable from health. It looked exactly like health for
# five days in Sep-2026 while every data job was dying at startup.
#
# So this posts a digest EVERY morning, pass or fail, as a comment on one
# pinned issue (which emails the repo owner). Because it arrives daily, its
# ABSENCE is the signal: no digest in your inbox = the automation is down.

name: Daily Data Digest

on:
  schedule:
    - cron: "0 1 * * *"     # 01:00 UTC = 07:00 Bangladesh, before the desk opens
  workflow_dispatch:

# integrity-gate: read-only — this job only READS the database (it runs
# integrity_check() itself and reports the verdict). It deliberately has no
# gate: a gate failing here would stop the report being posted at exactly the
# moment the report matters most.
permissions:
  contents: read
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the digest
        run: python digest.py

      - name: Post it to the pinned digest issue
        run: |
          set -e
          gh label create digest --color 0E8A16 --description "Daily data digest" --force >/dev/null 2>&1 || true
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label digest --state open \
                --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            # Take the number from the URL `gh issue create` prints. The first
            # run of this job created the issue and then looked it up by label,
            # got nothing back, and died on `invalid issue format: ""` — so the
            # one report designed to be read every morning never arrived. The
            # create call already knows the answer; don't ask twice.
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Daily data digest" --label digest \
              --body "Every morning this issue receives a report of what the data pipeline did overnight. **If a day passes with no new comment here, the automation itself is down.**")
            n="${url##*/}"
          fi
          if [ -z "$n" ]; then
            echo "::error::could not find or create the digest issue — the report has nowhere to go"
            exit 1
          fi
          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file digest.md
          echo "posted to issue #$n"
