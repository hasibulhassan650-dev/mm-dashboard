name: News Watch

# Liquidity Watch: reads Bangladesh's financial news every 30 minutes for liquidity events
# BB's own data does not hold (a subsidy release, arrears, support to a bank, a CRR change),
# has Claude classify the few that pass a keyword filter, checks what it says in code, stores
# the events and opens one issue (an email) for each that matters.
#
# It needs no Chrome and no BB: the sources are newspaper RSS feeds, so it keeps working
# while bb.org.bd is down - which is exactly when the press is the only source.
#
# Needs the repository secret ANTHROPIC_API_KEY. Without it the job still runs and still
# stores articles, but marks them untriaged; the digest and the integrity check then say,
# loudly, that Claude is not reading them. Nothing is silently dropped.
#
# backfill_since: re-reads history (the feeds only reach back a few days, so older
# material arrives through engines.news_backfill). Events found by a backfill are marked
# as already announced - history is not news.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "run (default), backfill (search the web month by month since the date below) or list"
        required: false
        default: "run"
      since:
        description: "backfill only: first date to cover"
        required: false
        default: "2026-07-01"

permissions:
  contents: read
  issues: write

concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Read the news
        run: python -m engines.news_triage ${{ inputs.action || 'run' }} --since "${{ inputs.since || '2026-07-01' }}"
      - name: Announce events that matter
        # Never after a backfill: its events are history and are already marked announced.
        if: ${{ !cancelled() && inputs.action != 'backfill' }}
        run: python -m engines.announce publish
      - name: Data integrity gate
        # The gate files or updates the same alert issue the hourly refresh does. It is
        # allowed to fail without turning THIS job red: defects that BB's outage causes are
        # already reported there every hour, and a news job that flaps red on someone
        # else's defect teaches you to ignore a red news job. A news-watch defect (stale,
        # or a backlog waiting for Claude) still reaches the issue and the digest.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/integrity-gate
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: "news watch"
