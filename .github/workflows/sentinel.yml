name: Uptime Sentinel

# Pings the live API + frontend and checks the deployed commit is current, so a
# dead host or a stale deploy alerts within a couple of hours instead of sitting
# silent. Files a GitHub issue on failure and auto-closes it on recovery.

on:
  schedule:
    - cron: "7,37 * * * *"    # twice an hour; GitHub still delays it, so ask often
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # the deploy-staleness check asks which commit LAST TOUCHED api/ and frontend/; a depth-1 clone always answers HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run sentinel
        id: run
        continue-on-error: true
        run: python sentinel.py

      - name: File or clear the alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create uptime --color FBCA04 --description "Uptime/deploy sentinel" --force >/dev/null 2>&1 || true
          OK=$(python -c "import json;print(json.load(open('verdict.json'))['ok'])")
          NUM=$(gh issue list --state open --label uptime --json number --jq '.[0].number' 2>/dev/null || echo "")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$OK" = "True" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "Recovered — all uptime checks passing. ($RUN_URL)"
            fi
          else
            BODY=$(python - <<'PY'
          import json
          v=json.load(open('verdict.json'))
          print("Automated uptime sentinel found problems ("+v["checked_utc"]+"):\n")
          for p in v["problems"]:
              print("- "+p)
          PY
          )
            BODY="$BODY

          Run: $RUN_URL"
            # A comment is an email: add one only when the set of problems CHANGED. Issue #18 collected a comment every
            # half hour for the same unchanged list.
            SHA=$(python -c "import json,hashlib;v=json.load(open('verdict.json'));import re;print(hashlib.sha1('|'.join(sorted(re.sub(r'[0-9]+','#',p) for p in v['problems'])).encode()).hexdigest()[:10])")
            BODY="$BODY

          problems-sha: $SHA"
            if [ -n "$NUM" ]; then
              LAST=$(gh issue view "$NUM" --json body,comments --jq '(.comments[-1].body // .body)' 2>/dev/null || true)
              if echo "$LAST" | grep -q "problems-sha: $SHA"; then
                echo "Same problems as the last report ($SHA) - no new comment."
              else
                gh issue comment "$NUM" --body "$BODY"
              fi
            else
              gh issue create --title "UPTIME ALERT: site/API unreachable or deploy stale" --label uptime --body "$BODY"
            fi
          fi
