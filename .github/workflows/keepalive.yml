# .github/workflows/keepalive.yml
#
# GitHub automatically DISABLES a repository's scheduled workflows after 60 days
# with no repository activity. For a fully hands-off repo (PC off, nobody
# committing), that would eventually pause the Full Data Refresh cron and the
# whole site would stop updating — silently.
#
# This job runs twice a month and pushes a tiny timestamp commit to the default
# branch. A commit counts as repository activity, which resets the 60-day clock
# and keeps every scheduled workflow alive indefinitely.
#
# Scheduled on the 1st and 15th: even if GitHub skips a run under load, the
# largest possible gap (~31 days) stays well inside the 60-day window.

name: Keep Alive

on:
  schedule:
    - cron: "0 5 1,15 * *"   # 05:00 UTC on the 1st and 15th of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push keep-alive commit
        run: |
          mkdir -p .github
          date -u +"Last keep-alive run: %Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          # [skip ci] keeps this commit from triggering any CI; it is only here
          # to register repository activity.
          git commit -m "chore: keep-alive [skip ci]" || { echo "no change"; exit 0; }
          git push
