# .github/workflows/reconcile.yml
#
# Every 3 days: re-fetch treasury-auction history from Bangladesh Bank and
# cross-check it against the stored data. Fills gaps, corrects clearly-wrong
# values, applies BB revisions, and flags ambiguous mismatches for review.
# A recent window is checked every run; a rotating historical slice means all
# 19 years get re-verified over successive runs. Self-correcting accuracy.

name: Data Reconciliation

on:
  schedule:
    - cron: "0 2 */3 * *"     # 02:00 UTC every 3rd day
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (optional, for a full explicit re-check)"
        required: false
      end_year:
        description: "End year (optional)"
        required: false

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TREASURY_POSTS_PER_CAPTURE: "18"   # fewer cookie captures → fits the window

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install xvfb (Chrome is pre-installed on the runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          google-chrome --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run reconciliation (Chrome under virtual display)
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" \
            python reconcile.py ${{ inputs.start_year }} ${{ inputs.end_year }}
