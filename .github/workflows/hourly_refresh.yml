# .github/workflows/hourly_refresh.yml
#
# HOURLY light refresh — keeps the intraday feeds fresh every hour without the
# heavy end-of-day GSOM securities scrape (that stays in full_refresh.yml,
# 3×/day). Runs OMO, treasury, call money, FX, ref rates, remittance, reserves,
# and the policy corridor (so an MPC rate change surfaces within the hour).
# Idempotent upserts make it safe alongside the full refresh.

name: Hourly Refresh

on:
  schedule:
    - cron: "30 * * * *"   # every hour at :30 (offset from the :00 full runs)
  workflow_dispatch:

concurrency:
  group: hourly-refresh
  cancel-in-progress: true   # a light run is quick; drop a stale one if it overruns

# Runner image is PINNED, not ubuntu-latest: that label migrates to Ubuntu 26
# on 19-Oct-2026, and the BB fetchers ride on the image's preinstalled Chrome
# plus undetected-chromedriver and xvfb. An OS swapped underneath that stack is
# the same shape of failure as the unpinned SQLAlchemy default that took every
# data job down for five days. Migrate deliberately: bump this, run the full
# refresh manually, and confirm Chrome still clears BB's F5 challenge.
jobs:
  refresh:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write          # integrity gate files/closes alert issues
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FETCH_MODE: "light"    # skip Step 1 GSOM
      OMO_DAYS_BACK: "35"    # just catch new press releases; history already stored
      OMO_MAX_FILES: "35"
      TREASURY_MONTHS: "1"
      CALLMONEY_DAYS: "20"
      REFRATE_DAYS: "20"
      IBFX_MONTHS: "1"    # interbank FX: current month + 1 back

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install xvfb (Chrome is pre-installed on the runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          google-chrome --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run light refresh (Chrome under virtual display)
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" python weekly_fetch.py

      - name: Data integrity gate
        if: always()
        uses: ./.github/actions/integrity-gate
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: "hourly refresh"
      - name: Summarise log
        if: always()
        run: |
          echo "===== weekly_fetch.log (tail) ====="
          tail -n 40 logs/weekly_fetch.log || echo "(no log file)"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hourly-log
          path: logs/weekly_fetch.log
          if-no-files-found: ignore
          retention-days: 3
