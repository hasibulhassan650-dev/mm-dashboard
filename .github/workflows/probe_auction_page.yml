# Diagnostic probe: fetch BB's auction-calendar page from CI (where Chrome
# clears the F5 wall) and upload the raw HTML as an artifact, so page
# redesigns can be inspected without a working local Chrome.
# Manual-only; delete when no longer needed.
name: Probe Auction Page

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps + xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Load calendar page in Chrome directly, dump page_source
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" python - <<'EOF'
          import re, time
          import undetected_chromedriver as uc
          from fetchers.bb_session import get_chrome_version

          AUC = "https://www.bb.org.bd/en/index.php/monetaryactivity/auc_calendar/1"
          options = uc.ChromeOptions()
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")
          driver = uc.Chrome(options=options, version_main=get_chrome_version())
          try:
              driver.get(AUC)
              html = ""
              for i in range(15):          # up to 150s for the challenge to clear
                  time.sleep(10)
                  html = driver.page_source or ""
                  cleared = "TSPD" not in html and "bobcmn" not in html
                  print(f"t+{(i+1)*10}s url={driver.current_url} bytes={len(html)} "
                        f"cleared={cleared} tables={len(re.findall(r'<table', html, re.I))}")
                  if cleared and len(html) > 20000:
                      break
              open("auc_calendar_probe.html", "w", encoding="utf-8").write(html)
              print("FINAL url:", driver.current_url)
              print("FINAL title:", re.findall(r"<title>([^<]*)</title>", html, re.I))
              print("FINAL tables:", len(re.findall(r"<table", html, re.I)))
              print("date-like:", re.findall(r"\d{1,2}-[A-Za-z]{3}-\d{4}", html)[:8])
              print("headings:", re.findall(r"Auction Calendar[^<]{0,60}", html)[:4])
          finally:
              driver.quit()
          EOF
      - name: Upload HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auc-calendar-html
          path: auc_calendar_probe.html
          if-no-files-found: warn
