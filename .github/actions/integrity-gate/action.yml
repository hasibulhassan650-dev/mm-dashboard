name: "Data integrity gate"
description: >
  Run validate.py, file/update/close the data-integrity alert issue, and fail
  the job when the stored data is wrong or stale. ONE copy of this logic, used
  by every workflow that writes to the database — reconcile.yml silently had no
  gate at all and wrote 32 bad rows over two weeks before anyone noticed.

inputs:
  github-token:
    description: "Token with issues:write, for filing the alert"
    required: true
  context:
    description: "Short label for the calling job, shown in the issue body"
    required: false
    default: "refresh"
  fail-job:
    description: >
      "false" lets a job whose BB reads can fail for reasons outside the repo (BB's firewall CAPTCHAs GitHub's
      runners) report through the one alert issue without also failing, which emailed twice an hour for the same
      unchanged problem. Everything that writes data and runs rarely keeps the default and still fails hard.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Run integrity checks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CONTEXT: ${{ inputs.context }}
        FAIL_JOB: ${{ inputs.fail-job }}
      run: |
        set -o pipefail
        # validate.py must ALWAYS leave parseable JSON behind: when it crashes
        # (it did, for five days, on an import error) an empty file made the
        # next line fail with a confusing JSONDecodeError instead of saying so.
        python validate.py > integrity.json 2> integrity.err || true
        if ! python -c "import json;json.load(open('integrity.json'))" 2>/dev/null; then
          echo "::error::validate.py produced no verdict — it crashed before checking anything."
          sed -n '1,40p' integrity.err || true
          python - <<'PY'
        import json
        err = ""
        try:
            err = open("integrity.err", encoding="utf-8", errors="replace").read()[-1500:]
        except Exception:
            pass
        json.dump({"ok": False, "issue_count": 1, "by_table": {"validator": 1},
                   "issues": ["validator: validate.py crashed before running any check — "
                              + (err.strip().splitlines() or ["no output"])[-1]]},
                  open("integrity.json", "w"))
        PY
        fi
        cat integrity.json
        ok=$(python -c "import json;print(json.load(open('integrity.json'))['ok'])")

        n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label data-integrity --state open --json number --jq '.[0].number // empty')
        if [ "$ok" = "True" ]; then
          echo "Integrity OK"
          if [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Integrity checks passing again as of ${CONTEXT} run ${GITHUB_RUN_ID}. Auto-closing."
          fi
          exit 0
        fi

        echo "Integrity FAILED — filing alert issue"

        # The title is the subject line of the email this sends, so it has to
        # carry the actual problem. "checks failing" told the reader nothing and
        # looked identical whether one series was a day late or an entire feed
        # had been dead for a fortnight.
        python - <<'PY' > alert_title.txt
        import json
        rep = json.load(open("integrity.json"))
        issues = rep.get("issues") or []
        esc = [i for i in issues if "ESCALATED" in i]
        pick = (esc or issues or ["checks failing"])[0]
        # "freshness: omo: ESCALATED — nothing newer than ..." -> drop the prefix
        for p in ("freshness: ", "guardian: "):
            if pick.startswith(p):
                pick = pick[len(p):]
                break
        pick = pick.replace("ESCALATED — ", "").strip()
        if len(pick) > 110:
            pick = pick[:107] + "..."
        more = f" (+{len(issues) - 1} more)" if len(issues) > 1 else ""
        kind = "ESCALATION" if esc else "DATA INTEGRITY"
        print(f"{kind}: {pick}{more}")
        PY
        title=$(cat alert_title.txt)
        echo "title: $title"

        body="Automated data-integrity alert from ${CONTEXT} run [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}):

        \`\`\`json
        $(cat integrity.json)
        \`\`\`"
        # A new comment is an email: add one only when the set of problems changed, not every run.
        sha=$(python -c "import json,hashlib;r=json.load(open('integrity.json'));print(hashlib.sha1('|'.join(sorted(r.get('issues') or [])).encode()).hexdigest()[:10])")
        body="$body$(printf '\n\nissues-sha: %s' "$sha")"
        if [ -n "$n" ]; then
          # Keep the title current: a stale title describing a resolved problem
          # while a worse one is open is how an alert stops being read.
          gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --title "$title" || true
          last=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '(.comments[-1].body // .body)' || true)
          if echo "$last" | grep -q "issues-sha: $sha"; then
            echo "Same problems as the last report ($sha) - no new comment."
          else
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
        else
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --label data-integrity --body "$body"
        fi
        if [ "$FAIL_JOB" = "true" ]; then
          exit 1
        fi
        echo "Integrity problems are reported in the alert issue; this job is configured not to fail on them."
        exit 0
