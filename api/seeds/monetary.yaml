#   - CRR / SLR: Bangladesh Bank circulars (change rarely)
#
# HOW TO MAINTAIN:
#   - `monthly`: one row per month (YYYY-MM); append a new row each month.
#   - `reserve_requirements`: one row per change (effective-dated); latest = current.
