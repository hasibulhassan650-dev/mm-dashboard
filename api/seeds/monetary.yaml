#   m2_growth             - Broad money (M2) growth, YoY
#   reserve_money_growth  - Reserve money growth, YoY
#   private_credit_growth - Private-sector credit growth, YoY
#   wavg_deposit          - Weighted-average deposit rate (banking system)
#   wavg_lending          - Weighted-average lending rate (banking system)
# (lending-deposit spread is computed by the app)
# ============================================================================

